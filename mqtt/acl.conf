# ============================================
# KAVACHGRID 3.0 — MQTT Access Control List
# Phase 3: Full implementation
# ============================================

# Feeder node — can only publish to its topic
user feeder_node
topic write kavachgrid/feeder

# Consumer nodes — can only publish to their topics
user consumer_node
topic write kavachgrid/meter/#

# Localization node
user localization_node
topic write kavachgrid/localization/#

# Backend — can subscribe to everything, publish alerts
user kavachgrid_backend
topic read kavachgrid/#
topic write kavachgrid/alerts
topic write kavachgrid/commands/#

# Dashboard — read-only via WebSocket
user dashboard
topic read kavachgrid/#
